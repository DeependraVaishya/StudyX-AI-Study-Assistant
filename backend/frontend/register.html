<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudyX</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="auth-info">

            <a href="index.html" class="logo">
                <span class="logo-icon">✦</span>
                <span>Study<span>X</span></span>
            </a>

            <div class="auth-info-content">

                <span class="section-label">JOIN STUDYX</span>

                <h1>
                    Build your
                    <span>learning journey.</span>
                </h1>

                <p>
                    Create your StudyX account and get a
                    personalized AI-powered learning experience.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-form-wrapper">

            <div class="auth-form">

                <div class="form-heading">

                    <h2>Create account</h2>

                    <p>
                        Start your smarter learning journey
                    </p>

                </div>


                <form id="registerForm">

                    <!-- NAME -->
                    <div class="input-group">

                        <label for="registerName">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="registerEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Create StudyX Account
                        <span>→</span>
                    </button>

                </form>


                <div class="divider">
                    <span>or</span>
                </div>


                <p class="signup-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
