<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StudyX</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-info">

            <a href="index.html" class="logo">
                <span class="logo-icon">✦</span>
                <span>Study<span>X</span></span>
            </a>

            <div class="auth-info-content">

                <span class="section-label">WELCOME BACK</span>

                <h1>
                    Your learning
                    <span>starts here.</span>
                </h1>

                <p>
                    Continue your learning journey with your
                    personal AI-powered study assistant.
                </p>

            </div>

        </div>


        <!-- Login Form -->
        <div class="auth-form-wrapper">

            <div class="auth-form">

                <div class="form-heading">
                    <h2>Welcome back</h2>
                    <p>Login to your StudyX account</p>
                </div>


                <form id="loginForm">

                    <div class="input-group">
                        <label for="loginEmail">Email address</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <div class="input-group">

                        <div class="label-row">
                            <label for="loginPassword">Password</label>

                            <a href="#">Forgot password?</a>
                        </div>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-button"
                    >
                        Login to StudyX
                        <span>→</span>
                    </button>

                </form>


                <div class="divider">
                    <span>or</span>
                </div>


                <p class="signup-text">
                    Don't have an account?
                    <a href="register.html">Create account</a>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
